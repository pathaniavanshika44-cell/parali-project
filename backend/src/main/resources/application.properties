# Spring Boot Application Name
spring.application.name=parali-backend

# Server port (optional, default 8080)
server.port=8080

# Datasource (for H2 in-memory DB for testing)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# ORS API Key
# ors.api.key=eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImYxMTdhYmJiMDNhYjQ3Zjk5YWE3ZDcxMTcxOTIxYWQ4IiwiaCI6Im11cm11cjY0In0=
ors.api.key=${ORS_API_KEY}
# JPA Hibernate settings (optional, useful for dev)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update